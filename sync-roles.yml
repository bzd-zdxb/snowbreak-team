name: Sync Roles JSON

on:
  push:
    paths:
      - 'roles/**'
      - 'web/sync_roles_to_web.py'
      - '.github/workflows/sync-roles.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install openpyxl

      - name: Run sync script
        run: python web/sync_roles_to_web.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/roles.json web/roles
          git diff --cached --quiet || git commit -m "chore: auto sync roles.json"
          git push
